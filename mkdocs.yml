site_name: Fastscaffold
repo_url: https://github.com/Tapeline/Fastscaffold
nav:
  - Home: index.md
  - Getting started:
      - Install: getting_started/install.md
      - Create first app: getting_started/create_first_app.md
  - Components:
      - Domain:
          - Entity: components/domain/entity.md
  - Contributing: contributing.md

theme:
  # took that from faststream
  name: material
  font:
    text: Roboto
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      #primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      #primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - search.suggest
    - search.highlight
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking     e url
    - navigation.prune
    - navigation.top
    - navigation.footer
    - navigation.path
    - content.tabs.link
    - content.tooltips
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.action.edit

plugins:
  - macros:
      module_name: docs.macros
  - autorefs
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

markdown_extensions:
  - toc:
      permalink: "#"             # replace TOC block symbol
      toc_depth: 3
  - mdx_include:
      base_path: .
      line_slice_separator: []
  - extra
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - def_list
