site_name: Fastscaffold
repo_url: https://github.com/Tapeline/Fastscaffold
nav:
  - Home: index.md
  - Getting started:
      - Install: getting_started/install.md
      - Create first app: getting_started/create_first_app.md
  - Components:
      - Domain:
          - Entity: components/domain/entity.md
      - Presentation:
          - Litestar: components/presentation/litestar.md
  - Contributing: contributing.md

theme:
  name: material2014
  primary_color: "#03A9F4"

plugins:
  - macros:
      module_name: docs/macros
  - mermaid2
  - ezglossary:
      tooltip: full
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

markdown_extensions:
  - toc:
      toc_depth: 3
  - extra
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - def_list
  - material2014.extensions.tabbed
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true