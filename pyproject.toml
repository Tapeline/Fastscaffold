[project]
name = "fastscaffold"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "camelsnake>=0.0.2",
    "inflect>=7.5.0",
    "jinja2>=3.1.6",
]

[build-system]
requires = ["setuptools >= 80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[dependency-groups]
docs = [
    "docstring-parser>=0.17.0",
    "mkdocs-macros-plugin>=1.3.7",
    "mkdocs-material2014[extras]>=0.6.0",
]
